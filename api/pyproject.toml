[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-lms-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "ruff>=0.11,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
