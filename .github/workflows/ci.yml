name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  data:
    name: Problem bank and resource links
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - run: python -m pip install 'pytest>=8,<10' 'ruff>=0.11,<1'
      - run: ruff check .
      - run: python -m pytest
      - run: python validate_problems.py
      - run: python check_links.py

  web:
    name: Web lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    name: API lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lms_test
          POSTGRES_DB: lms_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:lms_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/lms_test
